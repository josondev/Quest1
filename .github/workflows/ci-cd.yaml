name: CI/CD - Test - Build - Deploy

on:
  push:
    branches: [Rex]
  pull_request:
    branches: [Rex]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quest1registry001.azurecr.io
  IMAGE_NAME: quest1
  RESOURCE_GROUP: quest1-rg
  API_APP_NAME: quest1-api
  UI_APP_NAME: quest1-ui

jobs:
  # -----------------------------------------
  # JOB 1 - Install dependencies and run tests
  # -----------------------------------------
  test:
    name: Run Pytest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps (FFmpeg)
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) -print0 \
            | sudo xargs -r -0 sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  # -----------------------------------------
  # JOB 2 - Build Docker image + push to ACR
  # Only runs after the test job succeeds
  # -----------------------------------------
  build-push:
    name: Build & Push to ACR
    needs: test
    if: github.ref == 'refs/heads/Rex' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # -----------------------------------------
  # JOB 3 - Deploy to Azure Container Apps
  # Only runs after image is pushed
  # -----------------------------------------
  deploy:
    name: Deploy to Azure Container Apps
    needs: build-push
    if: github.ref == 'refs/heads/Rex' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API container
        run: |
          az containerapp update \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy UI container
        run: |
          az containerapp update \
            --name ${{ env.UI_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # -----------------------------------------
  # JOB 4 - Deploy GitHub Pages showcase
  # -----------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-push
    if: github.ref == 'refs/heads/Rex' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
